<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">

    <!-- ── PWA ── -->

    <meta name="theme-color" content="#faf7f2" id="themeColor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <script>
      /* Apply saved theme + locale before first paint to avoid a flash. */
      (function () {
        try {
          var theme = localStorage.getItem('dr-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var resolved = theme || system;
          document.documentElement.dataset.theme = resolved;
          var meta = document.getElementById('themeColor');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#080f16' : '#faf7f2');
          var locale = localStorage.getItem('dr-locale');
          if (locale) {
            document.documentElement.lang = locale === 'en' ? 'en' : 'ar';
            document.documentElement.dir = locale === 'en' ? 'ltr' : 'rtl';
          }
        } catch (e) {}
      })();
    </script>
  </head>
