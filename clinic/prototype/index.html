<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>عيادة د. أسامة شعير — حجز المواعيد</title>
    <meta
      name="description"
      content="احجز موعدك أونلاين في عيادة أ.د. أسامة شعير — استشاري جراحات وأمراض الذكورة."
    />

    <!-- ── PWA ── -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#faf7f2" id="themeColor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="د. أسامة شعير" />
    <meta name="application-name" content="د. أسامة شعير" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <script>
      /* Apply saved theme + locale before first paint to avoid a flash. */
      (function () {
        try {
          var theme = localStorage.getItem('dr-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var resolved = theme || system;
          document.documentElement.dataset.theme = resolved;
          var meta = document.getElementById('themeColor');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#080f16' : '#faf7f2');
          var locale = localStorage.getItem('dr-locale');
          if (locale) {
            document.documentElement.lang = locale === 'en' ? 'en' : 'ar';
            document.documentElement.dir = locale === 'en' ? 'ltr' : 'rtl';
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body data-page="home" data-title="meta.title">
    <script src="i18n.js"></script>
    <script src="core.js"></script>

    <main id="main">
      <!-- ══════════════ Hero ══════════════ -->
      <section class="hero">
        <div class="wrap hero-inner">
          <div class="hero-copy">
            <p class="eyebrow"><span class="dot"></span><span data-i18n="hero.eyebrow"></span></p>
            <h1 data-i18n-html="hero.title"></h1>
            <p class="lede" data-i18n="hero.lede"></p>

            <div class="hero-cta">
              <a class="primary-btn" href="booking.html">
                <span data-i18n="home.cta.book"></span>
                <svg class="dir-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="m14 5-7 7 7 7" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </a>
              <a class="ghost-btn" href="clinic.html" data-i18n="home.cta.clinic"></a>
            </div>

            <p class="hero-status" id="statusLine"></p>
          </div>

          <aside class="hero-media">
            <div class="doctor">
              <div class="doctor-badge">
                <picture class="doctor-photo">
                  <source
                    type="image/webp"
                    srcset="img/doctor-240.webp 240w, img/doctor-480.webp 480w"
                    sizes="(min-width: 900px) 210px, 88px"
                  />
                  <img
                    src="img/doctor-480.jpg"
                    srcset="img/doctor-240.jpg 240w, img/doctor-480.jpg 480w"
                    sizes="(min-width: 900px) 210px, 88px"
                    width="480"
                    height="735"
                    alt="أ.د. أسامة شعير"
                    data-i18n-alt="hero.doctorAlt"
                    decoding="async"
                    fetchpriority="high"
                  />
                </picture>
              </div>
              <div class="doctor-id">
                <p class="doctor-name" data-i18n="hero.doctorName"></p>
                <p class="doctor-role" data-i18n="hero.doctorRole"></p>
              </div>
            </div>
          </aside>
        </div>
      </section>

      <!-- ══════════════ Services ══════════════ -->
      <section class="home-services">
        <div class="wrap">
          <div class="section-head">
            <h2 data-i18n="home.services.title"></h2>
            <p data-i18n="home.services.desc"></p>
          </div>
          <div class="svc-list" id="serviceList"></div>
          <a class="section-link" href="booking.html" data-i18n="home.services.all"></a>
        </div>
      </section>

      <!-- ══════════════ How it works ══════════════ -->
      <section class="home-steps">
        <div class="wrap">
          <div class="section-head">
            <h2 data-i18n="home.steps.title"></h2>
          </div>
          <ol class="step-list">
            <li>
              <span class="step-num">1</span>
              <strong data-i18n="home.step1.title"></strong>
              <span data-i18n="home.step1.desc"></span>
            </li>
            <li>
              <span class="step-num">2</span>
              <strong data-i18n="home.step2.title"></strong>
              <span data-i18n="home.step2.desc"></span>
            </li>
            <li>
              <span class="step-num">3</span>
              <strong data-i18n="home.step3.title"></strong>
              <span data-i18n="home.step3.desc"></span>
            </li>
          </ol>
        </div>
      </section>

      <!-- ══════════════ Privacy note ══════════════ -->
      <section class="home-privacy">
        <div class="wrap">
          <div class="note-card">
            <span class="note-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5.1 7.5-9.5V6Z" stroke-linejoin="round" />
                <path d="m9 12 2.2 2.2L15.5 10" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <div>
              <h3 data-i18n="home.privacy.title"></h3>
              <p data-i18n="home.privacy.desc"></p>
              <a class="text-link" href="privacy.html" data-i18n="home.privacy.link"></a>
            </div>
          </div>
        </div>
      </section>
      <!-- ══════════════ Install the app ══════════════ -->
      <section class="home-install">
        <div class="wrap">
          <div class="install-card" id="installCard" hidden>
            <img class="install-card-icon" src="icons/icon-192.png" alt="" width="52" height="52" />
            <div class="install-card-body">
              <h3 data-i18n="install.cardTitle"></h3>
              <p data-i18n="install.cardText"></p>
            </div>
            <div class="install-card-actions">
              <button type="button" class="primary-btn install-card-btn" id="installCardBtn" data-i18n="install.cta"></button>
              <button type="button" class="icon-btn install-card-close" id="installCardClose" data-i18n-aria="install.dismiss">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer"></footer>

    <script src="install.js"></script>
    <script src="home.js"></script>
  </body>
</html>
